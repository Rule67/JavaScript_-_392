<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>ระบบบันทึกรายรับ–รายจ่าย</title>
    <script src="js/budgetform.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>ระบบบันทึกรายรับ–รายจ่าย</h2>

    <!--1.1 ฟอร์มรับข้อมูล-->
    <form id='budget-form'>
        <label for='item'>ชื่อรายการ:</label>
        <input type='text' id='item' name='item' required maxlength='50'>
        <br><br>

        <label for='amount'>จำนวนเงิน:</label>
        <input type='number' id='amount' name='amount' required min='1' max='1000000'>
        <br><br>

        <label for='date'>วันที่:</label>
        <input type='date' id='date' name='date' required>
        <br><br>

        <label for='time'>เวลา:</label>
        <input type='time' id='time' name='time' required>
        <br><br>

        <label for='category'>ประเภทรายการ รายรับ/รายจ่าย:</label>
        <select id='category' name='category' required>
            <option value=''>--เลือกประเภท--</option>
            <option value='รายรับ'>รายรับ</option>
            <option value='รายจ่าย'>รายจ่าย</option>
        </select>
        <br><br>

        <input type='submit' value='บันทึก'>
        <input type='reset' value='ยกเลิก'>
    </form>

    <hr>
    <!--1.3 รายการทั้งหมด-->
    <div>
        <h3>รายการทั้งหมด</h3>
        <ul id='transaction-list'></ul>
    </div>
    <hr>

    <!--1.2 แสดงผลสรุปยอดเงิน-->
    <div>
        <h3>สรุปยอดเงิน</h3>
        <p>รายรับรวม: <span id='revenue'>0.00</span> บาท</p>
        <p>รายจ่ายรวม: <span id='expense'>0.00</span> บาท</p>
        <p>ยอดคงเหลือ: <span id='total'>0.00</span> บาท</p>
    </div>

</body>
</html>
